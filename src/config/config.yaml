game:
  default_fps: 240
  physics_fps: 60

terrain:
  min_size: 900
  max_size: 1300
  mesh_main_density: 0.15

  main_frequency: 0.05
  main_amplitude: 1

  background_frequency: 0.001
  background_amplitude: 30
  
  mountains_frequency: 0.006
  mountains_amplitude: 35
  mountains_chance: 0.004

track:
  centerline_samples: 500

  min_segments: 8
  max_segments: 20
  max_segment_variation: 0.004
  segment_border: 0.01

  min_sector_length: 2
  change_sector_chance: 0.8

  border: 0.2
  center: 0.3

  max_tries: 10

  casual: 
    segment_weight: 1

    max_anchor_per_segment: 2
    multiple_anchors_chance: 0.3

    middle_cross_chance: 0.4
    middle_cross_distance: 0.2

    min_anchor_distance: 20
    max_anchor_distance: 400

    min_curve_angle: 45
    max_curve_angle: 160

  f1: 
    segment_weight: 3

    max_anchor_per_segment: 4
    multiple_anchors_chance: 0.8

    middle_cross_chance: 0
    middle_cross_distance: 0.2

    min_anchor_distance: 20
    max_anchor_distance: 400

    min_curve_angle: 60
    max_curve_angle: 160

  rally: 
    segment_weight: 1

    max_anchor_per_segment: 3
    multiple_anchors_chance: 0.7

    middle_cross_chance: .1
    middle_cross_distance: 0.2

    min_anchor_distance: 20
    max_anchor_distance: 400

    min_curve_angle: 30
    max_curve_angle: 100

  touring: 
    segment_weight: 2

    max_anchor_per_segment: 2
