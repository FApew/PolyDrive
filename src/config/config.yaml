game:
  default_fps: 240
  physics_fps: 120

terrain:
  min_size: 900
  max_size: 1300
  mesh_main_density: 0.15

  main_frequency: 0.05
  main_amplitude: 1

  background_frequency: 0.001
  background_amplitude: 30
  
  mountains_frequency: 0.006
  mountains_amplitude: 35
  mountains_chance: 0.004

road:
  elevation: 2.3
  thickness: 3.2

car:
  camera_follow_smoothness: 15

  f1:
    frictionSlip: 7
    sideFrictionStiffness: 1.2
    suspensionStiffness: 100
    suspensionCompression: 8
    suspensionRelaxation: 7
    maxSuspensionTravel: 0.2
    engineForce: 6000
    

