  drift: 
    segment_weight: 2

    max_anchor_per_segment: 2
    multiple_anchors_chance: 0.8

    middle_cross_chance: 0.3
    middle_cross_distance: 0.2

    min_anchor_distance: 20
    max_anchor_distance: 200

    min_curve_angle: 60
    max_curve_angle: 160

  karting: 
    segment_weight: 1

    max_anchor_per_segment: 2
