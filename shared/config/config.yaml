game:
  default_fps: 240
  physics_fps: 120

  shadow_quality: 4096

  codes_length: 5
  username_lenght: 20

terrain:
  min_size: 900
  max_size: 1300
  mesh_main_density: 0.15

  main_frequency: 0.05
  main_amplitude: 1

  background_frequency: 0.001
  background_amplitude: 0 #30
  
  mountains_frequency: 0.006
  mountains_amplitude: 35
  mountains_chance: 0.004

road:
  elevation: 2.3
  thickness: 3.2

lobby: 
  orbit_constraints:
    polar_angle: {min: 5, max: 75}
    zoom: {min: 3, max: 5}

car:
  camera_follow_smoothness: 15

  models:
    giulia:   # Quadrifoglio: 2.9 V6 biturbo, 90°, ~7000 limiter
      wheel_size: 1
      wheel_pos: {x: -0.762, y: 0, z: 1.4}

      headlights_pos: {x: 0.639, y: 0.35, z: 2.1}
      backlights_pos: {x: 0.591, y: 0.44, z: -2.06}

      default_color: 0x218560
      elevation: 0

      cylinders: 6
      rpm: {min: 850, max: 7000}

      sound:
        samples:
          volume: 0.28
          pitch: {min: 0.68, max: 1.08}
          saturation: {kind: "tube", drive: 2.6, mix: 0.12, highpass: 180}

        synthesis:
          harmonics: [{
              order: 0.5,
              master: 0.38,
              wave: "triangle",
              gainByRPM: [{max: 850, gain: 0.12}, {max: 1800, gain: 0.11}, {max: 3500, gain: 0.07}, {max: 5200, gain: 0.03}, {max: 7000, gain: 0.015}]
            }, {
              order: 1,
              master: 0.95,
              wave: "triangle",
              gainByRPM: [{max: 850, gain: 0.42}, {max: 1800, gain: 0.38}, {max: 3500, gain: 0.31}, {max: 5200, gain: 0.24}, {max: 7000, gain: 0.18}]
            }, {
              order: 2,
              master: 0.5,
              wave: "triangle",
              gainByRPM: [{max: 850, gain: 0.06}, {max: 1800, gain: 0.10}, {max: 3500, gain: 0.14}, {max: 5200, gain: 0.16}, {max: 7000, gain: 0.13}]
            }, {
              order: 3,
              master: 0.42,
              wave: "triangle",
              gainByRPM: [{max: 850, gain: 0.01}, {max: 1800, gain: 0.05}, {max: 3500, gain: 0.12}, {max: 5200, gain: 0.17}, {max: 7000, gain: 0.15}]
            }, {
              order: 4,
              master: 0.28,
              wave: "sawtooth",
              gainByRPM: [{max: 850, gain: 0}, {max: 1800, gain: 0.005}, {max: 3500, gain: 0.025}, {max: 5200, gain: 0.06}, {max: 7000, gain: 0.07}]
            }, {
              order: 5,
              master: 0.22,
              wave: "triangle",
              gainByRPM: [{max: 850, gain: 0}, {max: 1800, gain: 0.005}, {max: 3500, gain: 0.018}, {max: 5200, gain: 0.045}, {max: 7000, gain: 0.05}]
            }, {
              order: 6,
              master: 0.14,
              wave: "sawtooth",
              gainByRPM: [{max: 850, gain: 0}, {max: 1800, gain: 0}, {max: 3500, gain: 0.008}, {max: 5200, gain: 0.02}, {max: 7000, gain: 0.028}]
            }
          ]

          sub_bass: {volume: 0.028, rumble_frequency: 42, rumble_volume: 0.012}
          rasp: {volume: 0.045, highpass: 950, cutoff: {min: 1800, max: 6200}, min_rpm_normalized: 0.62}

        layers:
          rumble: {volume: 0.055, cutoff: 110}
          intake: {volume: 0.075, cutoff: {min: 650, max: 3900}}
          exhaust: {volume: 0.19, cutoff: {min: 520, max: 4200}, q: 2.8}

        effects:
          resonators: [{frequency: 82, q: 1.7, gain: 1.1}, {frequency: 185, q: 2.0, gain: 1.5}, {frequency: 620, q: 2.4, gain: 2.2}, {frequency: 1250, q: 3.0, gain: 2.8}, {frequency: 2700, q: 3.2, gain: 1.8}, {frequency: 4300, q: 2.8, gain: 1.0}]
          comb: {enabled: true, delay_ms: 1.18, tracking_ms: 0.32, mix: 0.045}
          output:
            reverb: {mix: 0.012, seconds: 0.20}
            low_shelf: {frequency: 78, gain: 0.8}
            presence: {frequency: 1250, q: 1.8, gain: 2.8}
            high_shelf: {frequency: 3800, gain: 2.5}

        events:
          tip_in: {threshold: 0.28, gain: 0.22, drive: 1.0, decay: 0.10}
          overrun: {min_rpm_normalized: 0.40, density: 10, volume: 1.0}
          limiter: {min_rpm_normalized: 0.98, rate_hz: 13, depth: 0.88, pop_on_cut: true, pop_volume: 0.35}
          shift_bangs: {cut_ms: 82, depth: 0.82, pops: 3, volume: 0.72}
          pops: {volume: 1.0, frequency: 2000, duration: 0.06, min_rpm_normalized: 0.36, cooldown: 0.09}

    f40:   # 2.9 V8 twin-turbo, cross-plane, ~7750 limiter
      wheel_size: 1.05
      wheel_pos: {x: -0.81, y: 0, z: 1.225}

      headlights_pos: {x: 0.805, y: 0.212, z: 2.14}
      backlights_pos: {x: 0.613, y: 0.341, z: -2.085}

      default_color: 0xff2800
      elevation: 0

      cylinders: 8
      rpm: {min: 1000, max: 7500}

      sound:
        samples:
          volume: 0.30
          pitch: {min: 0.95, max: 1.68}
          saturation: {kind: "tube", drive: 3.0, mix: 0.13, highpass: 320}

        synthesis:
          harmonics: [{
              order: 0.5,
              master: 0.38,
              wave: "triangle",
              gainByRPM: [{max: 1000, gain: 0.10}, {max: 2000, gain: 0.08}, {max: 3500, gain: 0.05}, {max: 5200, gain: 0.025}, {max: 7500, gain: 0.012}]
            }, {
              order: 1,
              master: 0.82,
              wave: "triangle",
              gainByRPM: [{max: 1000, gain: 0.28}, {max: 2000, gain: 0.24}, {max: 3500, gain: 0.20}, {max: 5200, gain: 0.16}, {max: 7500, gain: 0.11}]
            }, {
              order: 2,
              master: 0.58,
              wave: "triangle",
              gainByRPM: [{max: 1000, gain: 0.06}, {max: 2000, gain: 0.14}, {max: 3500, gain: 0.20}, {max: 5200, gain: 0.22}, {max: 7500, gain: 0.20}]
            }, {
              order: 3,
              master: 0.46,
              wave: "triangle",
              gainByRPM: [{max: 1000, gain: 0.015}, {max: 2000, gain: 0.06}, {max: 3500, gain: 0.13}, {max: 5200, gain: 0.18}, {max: 7500, gain: 0.20}]
            }, {
              order: 4,
              master: 0.38,
              wave: "triangle",
              gainByRPM: [{max: 1000, gain: 0.005}, {max: 2000, gain: 0.018}, {max: 3500, gain: 0.055}, {max: 5200, gain: 0.10}, {max: 7500, gain: 0.12}]
            }, {
              order: 5,
              master: 0.26,
              wave: "triangle",
              gainByRPM: [{max: 1000, gain: 0}, {max: 2000, gain: 0.01}, {max: 3500, gain: 0.035}, {max: 5200, gain: 0.07}, {max: 7500, gain: 0.09}]
            }, {
              order: 6,
              master: 0.18,
              wave: "triangle",
              gainByRPM: [{max: 1000, gain: 0}, {max: 2000, gain: 0.008}, {max: 3500, gain: 0.025}, {max: 5200, gain: 0.055}, {max: 7500, gain: 0.07}]
            }, {
              order: 8,
              master: 0.14,
              wave: "triangle",
              gainByRPM: [{max: 1000, gain: 0}, {max: 2000, gain: 0}, {max: 3500, gain: 0.012}, {max: 5200, gain: 0.04}, {max: 7500, gain: 0.06}]
            }
          ]

          sub_bass: {volume: 0.022, rumble_frequency: 34, rumble_volume: 0.014}
          rasp: {volume: 0.026, highpass: 2100, cutoff: {min: 2800, max: 5800}, min_rpm_normalized: 0.66}

        layers:
          rumble: {volume: 0.052, cutoff: 145}
          intake: {volume: 0.095, cutoff: {min: 700, max: 5200}}     # twin-turbo induction
          exhaust: {volume: 0.145, cutoff: {min: 420, max: 3000}, q: 1.45}

        effects:
          resonators: [{frequency: 118, q: 1.3, gain: 0.7}, {frequency: 260, q: 1.6, gain: 1.0}, {frequency: 760, q: 1.9, gain: 1.9}, {frequency: 1550, q: 2.2, gain: 2.4}, {frequency: 3400, q: 2.5, gain: 1.4}]
          comb: {enabled: true, delay_ms: 1.55, tracking_ms: 0.48, mix: 0.04}
          output:
            reverb: {mix: 0.008, seconds: 0.18}   # drier, punchier
            low_shelf: {frequency: 92, gain: -0.4}
            presence: {frequency: 1800, q: 1.6, gain: 2.4}
            high_shelf: {frequency: 4500, gain: 3.2}

        events:
          tip_in: {threshold: 0.25, gain: 0.24, drive: 1.1, decay: 0.09}
          overrun: {min_rpm_normalized: 0.42, density: 9, volume: 1.0}
          limiter: {min_rpm_normalized: 0.99, rate_hz: 13, depth: 0.84, pop_on_cut: true, pop_volume: 0.42}
          shift_bangs: {cut_ms: 78, depth: 0.86, pops: 3, volume: 0.68}
          pops: {volume: 0.92, frequency: 2050, duration: 0.055, min_rpm_normalized: 0.42, cooldown: 0.10}

  tuning:
    f1:
      frictionSlip: 7
      sideFrictionStiffness: 1.2
      suspensionStiffness: 100
      suspensionCompression: 8
      suspensionRelaxation: 7
      maxSuspensionTravel: 0.2
      engineForce: 6000


