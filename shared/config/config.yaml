  centerline_samples: 1000

  turn_size: 8
  inner_turn_max_distance: 8
  inner_turn_min_distance: 3
  turn_smoothness: 18

  min_segments: 8
  max_segments: 20
  max_segment_variation: 0.004
  segment_border: 0.01

  min_sector_length: 2
  change_sector_chance: 0.8

  border: 0.2
  center: 0.3

  max_tries: 10

  casual: 
    segment_weight: 1

    track_width: 7

    max_anchor_per_segment: 2
    multiple_anchors_chance: 0.3

    middle_cross_chance: 0.4
    middle_cross_distance: 0.2

    min_anchor_distance: 20
    max_anchor_distance: 400

    min_curve_angle: 50
    max_curve_angle: 160

  f1: 
    segment_weight: 3

    track_width: 12.5

    max_anchor_per_segment: 4
    multiple_anchors_chance: 0.8

    middle_cross_chance: 0
    middle_cross_distance: 0.2

    min_anchor_distance: 20
    max_anchor_distance: 400

    min_curve_angle: 65
    max_curve_angle: 160

  rally: 
    segment_weight: 1

    track_width: 5.5

    max_anchor_per_segment: 3
    multiple_anchors_chance: 0.7

    middle_cross_chance: .1
    middle_cross_distance: 0.2

    min_anchor_distance: 20
    max_anchor_distance: 400

    min_curve_angle: 40
    max_curve_angle: 100

  touring: 
