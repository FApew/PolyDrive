    multiple_anchors_chance: 0.8

    middle_cross_chance: 0
    middle_cross_distance: 0.2

    min_anchor_distance: 100
    max_anchor_distance: 400

    min_curve_angle: 25
    max_curve_angle: 90

  drift: 
    segment_weight: 2

    track_width: 10

    max_anchor_per_segment: 2
    multiple_anchors_chance: 0.8

    middle_cross_chance: 0.3
    middle_cross_distance: 0.2

    min_anchor_distance: 20
    max_anchor_distance: 200

    min_curve_angle: 70
    max_curve_angle: 160

  karting: 
    segment_weight: 1

    track_width: 6

    max_anchor_per_segment: 2
